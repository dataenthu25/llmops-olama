name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint-and-import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check imports (syntax/structure sanity check)
        run: python3 -c "import main"

  eval-suite:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull models
        run: |
          ollama serve &
          sleep 5
          ollama pull qwen2.5-coder:7b
          ollama pull nomic-embed-text
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ingest test documents
        run: cd rag && python3 ingestor.py
      - name: Start FastAPI server
        run: |
          uvicorn main:app &
          sleep 5
      - name: Run eval suite
        run: python3 evals/run_evals.py